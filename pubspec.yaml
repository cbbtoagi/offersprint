name: interview_flash
description: "冲刺Offer：算法题库冲刺 + 大模型八股速刷 + 模拟面试，三端离线。"
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.0
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.5.0
  path_provider: ^2.1.4
  path: ^1.9.0
  record: ^7.1.1
  speech_to_text: ^7.4.0
  audioplayers: ^6.1.0
  gpt_markdown: ^1.0.0
  share_plus: ^10.0.2
  intl: ^0.19.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/algo/content/

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
